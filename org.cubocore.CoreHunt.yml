app-id: org.cubocore.CoreHunt
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: corehunt
rename-desktop-file: cc.cubocore.CoreHunt.desktop
rename-icon: cc.cubocore.CoreHunt
rename-appdata-file: cc.cubocore.CoreHunt.metainfo.xml
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=home # For accessing cubocore global app settings
  - --filesystem=host:ro # For searching files across the user filesystem
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/pkgconfig
  - /man
  - /share/man
  - /lib/*.la
  - /lib/*.a
modules:
  - name: libcprime
    buildsystem: cmake-ninja
    config-opts: [
        "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    ]
    sources:
      - type: git
        url: https://gitlab.com/cubocore/libcprime.git
        commit: 17d4c94f3be2c7f67dc757cf852f0144945c2c69
        tag: v5.0.1
  - name: corehunt
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://gitlab.com/cubocore/coreapps/corehunt.git
        commit: 405712a57ba41bd44212e83726afbecc5188ac27
        tag: v5.0.1
      - type: patch
        path: fix-appID-name.patch

